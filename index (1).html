<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CLO Gradebook | Sổ điểm 50%</title>
  <style>
    :root {font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#17283f; background:#f5f7fb}
    * {box-sizing:border-box} body {margin:0;line-height:1.55} button,input,select{font:inherit}
    button{cursor:pointer;border:0} button:disabled{opacity:.5;cursor:not-allowed}
    .shell{max-width:1250px;margin:auto;padding:28px 22px 60px}
    .hero{background:linear-gradient(125deg,#123a68,#245b94);border-radius:22px;color:#fff;padding:26px 30px;box-shadow:0 12px 32px #173b6817}
    .hero h1{font-size:27px;line-height:1.25;margin:6px 0 8px}.hero p{margin:0;color:#d9e9fa;font-size:14px}
    .topline{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
    .eyebrow{font-size:11px;letter-spacing:1.5px;font-weight:800;color:#a9d2ff}
    .pill{display:inline-flex;align-items:center;border-radius:99px;padding:5px 10px;background:#ffffff21;color:#fff;font-size:12px;font-weight:650}
    .nav{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}
    .tab{padding:10px 17px;border-radius:10px;background:#e8edf5;color:#365170;font-weight:750}
    .tab.active{background:#1f5a96;color:#fff}
    .panel{background:#fff;border:1px solid #e2e8f2;border-radius:16px;padding:21px;box-shadow:0 5px 18px #20395308}
    .panel + .panel{margin-top:16px} .panel h2{margin:0 0 10px;font-size:19px}
    .muted{color:#64758a;font-size:13px} .small{font-size:12px} .section-head{display:flex;gap:15px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
    .section-head h2{margin:0}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
    .btn{background:#245e9d;color:#fff;border-radius:9px;padding:10px 14px;font-size:13px;font-weight:750}
    .btn.secondary{background:#ecf2f9;color:#22568c}.btn.outline{border:1px solid #cfdbeb;background:#fff;color:#22568c}
    .btn.danger{color:#b33535;background:#fff2f2}.btn.tiny{padding:6px 10px;font-size:12px}
    .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
    .stat{background:#fff;border:1px solid #e2e8f2;border-radius:14px;padding:15px 18px}
    .stat span{font-size:12px;color:#6a7b8c}.stat strong{display:block;margin-top:4px;font-size:25px;color:#183d63}
    .table-wrap{overflow:auto;width:100%} table{border-collapse:collapse;width:100%;min-width:900px}
    th,td{padding:11px 10px;border-bottom:1px solid #e9edf3;text-align:left;vertical-align:middle}
    th{font-size:12px;white-space:nowrap;color:#5c7190;background:#f7f9fc;font-weight:800}
    td{font-size:13px}.num{text-align:right;font-variant-numeric:tabular-nums}.score{font-weight:800;color:#1b5c90}
    .badge{border-radius:99px;padding:4px 9px;font-size:11px;font-weight:750;display:inline-block}
    .badge.ok{background:#e3f7ee;color:#11734e}.badge.wait{background:#fff1d5;color:#98671a}
    .form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-top:10px}
    label{display:block;font-weight:700;font-size:12px;color:#56697e;margin-bottom:5px}
    input,select{border:1px solid #cfd9e8;border-radius:9px;padding:9px 10px;background:#fff;color:#17283f;min-width:0;max-width:100%}
    input:focus,select:focus{outline:2px solid #83b6ed;outline-offset:1px}
    input[type=number]{width:94px}.wide{min-width:200px;width:100%}
    .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .hint{padding:13px 14px;background:#eef5fc;color:#274e73;font-size:13px;border-radius:10px;margin:12px 0}
    .warning{background:#fff4dc;color:#805418}.error{background:#ffe9e9;color:#8b2929}
    .footnote{font-size:12px;color:#718198;margin-top:14px}
    dialog{border:1px solid #d9e4f1;border-radius:18px;padding:0;width:min(650px,95vw);max-height:90vh;box-shadow:0 20px 70px #17283f40}
    dialog::backdrop{background:#132d49a3}.dialog-body{padding:24px}.dialog-body h2{margin:0 0 8px}
    .dialog-footer{display:flex;justify-content:flex-end;gap:10px;padding-top:16px;margin-top:18px;border-top:1px solid #e7edf4}
    .criteria-list{display:grid;grid-template-columns:1fr 100px 100px;align-items:center;gap:11px;margin-top:15px}
    .criteria-list input{width:100%}.session-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:14px}
    .session-cell{padding:10px;border:1px solid #dfe7f0;border-radius:10px}.session-cell label{margin-bottom:5px}
    .session-cell.future{opacity:.52}
    .actions{display:flex;gap:7px;flex-wrap:wrap}.empty{padding:20px;text-align:center;color:#687b93}
    .footer{margin-top:18px;font-size:12px;color:#718198}
    @media(max-width:780px){.shell{padding:14px}.hero{padding:20px}.cards{grid-template-columns:repeat(2,1fr)}.grid2,.grid3{grid-template-columns:1fr}.panel{padding:14px}.criteria-list{grid-template-columns:1fr 70px 70px}.session-grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="topline"><div class="eyebrow">BẢN MẪU • DÙNG ĐỂ HỌC LẬP WEB</div><span class="pill">Chưa có AI chấm bài</span></div>
      <h1>CLO Gradebook — Sổ điểm quá trình</h1>
      <p>Quản lý bài nhóm theo rubric, điểm danh từng buổi, lượt cộng và tính điểm 50%.</p>
    </header>
    <nav class="nav" id="nav" aria-label="Chức năng chính">
      <button class="tab active" data-tab="gradebook">Sổ điểm</button>
      <button class="tab" data-tab="rubric">Rubric &amp; CLO</button>
      <button class="tab" data-tab="settings">Công thức &amp; thiết lập</button>
    </nav>
    <div id="screen" aria-live="polite"></div>
    <p class="footer">Dữ liệu demo chỉ lưu trong trình duyệt này. Không nhập thông tin cá nhân thật hoặc dùng làm sổ điểm chính thức.</p>
  </main>
  <dialog id="modal" aria-label="Nhập dữ liệu"><div class="dialog-body" id="modalBody"></div></dialog>
  <input type="file" accept=".json,application/json" id="importInput" hidden>
  <script>
    'use strict';
    const STORAGE_KEY = 'clo_gradebook_demo_2026_v1';
    const SESSION_COUNT = 11;
    const defaultData = () => ({
      course: 'Quản trị kênh phân phối (312121)',
      weights: {self:30,mid:20,work:80,attendance:15,activity:5},
      cap:8.5, bonusUnit:0.2, bonusCap:1, sessionsDone:3,
      criteria: [
        {id:'c1', name:'Vai trò và khái niệm kênh phân phối', clo:'121-K1', max:1.5},
        {id:'c2', name:'Phân tích môi trường kênh', clo:'121-K2', max:2},
        {id:'c3', name:'Thiết kế và lựa chọn cấu trúc kênh', clo:'121-K3', max:2.5},
        {id:'c4', name:'Ứng dụng công nghệ và TMĐT', clo:'121-K4', max:2},
        {id:'c5', name:'Lập luận và minh chứng', clo:'CLO kỹ năng (cần xác nhận)', max:2}
      ],
      students:[
        {id:'SV001', name:'Sinh viên A', group:'Nhóm 1',mid:7.5,activity:8,bonuses:1,attendance:[true,true,true,...Array(8).fill(null)]},
        {id:'SV002', name:'Sinh viên B', group:'Nhóm 1',mid:8,activity:7,bonuses:0,attendance:[true,true,false,...Array(8).fill(null)]},
        {id:'SV003', name:'Sinh viên C', group:'Nhóm 2',mid:6.5,activity:8,bonuses:2,attendance:[true,false,true,...Array(8).fill(null)]},
        {id:'SV004', name:'Sinh viên D', group:'Nhóm 2',mid:7,activity:9,bonuses:1,attendance:[true,true,true,...Array(8).fill(null)]}
      ],
      groupScores: {
        'G:Nhóm 1':{c1:1.5,c2:1.5,c3:2,c4:1,c5:1.5},
        'G:Nhóm 2':{c1:1,c2:1.5,c3:1.5,c4:1.5,c5:1.5}
      }
    });
    const $ = (selector) => document.querySelector(selector);
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const numeric = (v) => v === '' || v === null || v === undefined ? null : Number(v);
    const fmt = (v, digits=2) => Number.isFinite(v) ? v.toLocaleString('vi-VN',{minimumFractionDigits:digits,maximumFractionDigits:digits}) : '—';
    const clamp = (n,min,max) => Math.max(min,Math.min(max,n));
    const clone = (obj) => JSON.parse(JSON.stringify(obj));
    function load() {try {const stored=localStorage.getItem(STORAGE_KEY); return stored ? JSON.parse(stored) : defaultData();} catch {return defaultData();}}
    let data = load(); let currentTab='gradebook';
    function persist() {try {localStorage.setItem(STORAGE_KEY,JSON.stringify(data));} catch (err) {alert('Trình duyệt không lưu được. Hãy xuất file JSON để sao lưu.');}}
    const groupKey = student => student.group.trim() ? `G:${student.group.trim()}` : `S:${student.id}`;
    const groupLabel = student => student.group.trim() || `Bài cá nhân: ${student.id}`;
    function isValidConfig() { const w=data.weights; return Math.abs(w.self+w.mid-50)<.0001 && Math.abs(w.work+w.attendance+w.activity-100)<.0001 && data.criteria.every(c=>c.max>0) && data.criteria.length>0;}
    function assignment(student) {
      const scores=data.groupScores[groupKey(student)];
      if (!scores || !data.criteria.length) return null;
      const max=data.criteria.reduce((sum,c)=>sum+Number(c.max),0);
      if (max<=0 || data.criteria.some(c=>!Number.isFinite(Number(scores[c.id])) || scores[c.id]===null || scores[c.id]===undefined || scores[c.id]==='')) return null;
      const earned=data.criteria.reduce((sum,c)=>sum+clamp(Number(scores[c.id]),0,Number(c.max)),0);
      return Math.min(Number(data.cap),10*earned/max);
    }
    function attendance(student) {
      const count=Number(data.sessionsDone);
      if (count===0) return null;
      const first=student.attendance.slice(0,count);
      if (first.length!==count || first.some(v=>v===null || v===undefined)) return null;
      return 10*first.filter(v=>v===true).length/count;
    }
    function summarize(student) {
      const a=assignment(student), d=attendance(student), p=numeric(student.activity),m=numeric(student.mid);
      const bonus=Math.min(Number(data.bonusCap),Number(student.bonuses||0)*Number(data.bonusUnit));
      const self=a===null||d===null||p===null||!isValidConfig()?null:Math.min(10, a*data.weights.work/100 + d*data.weights.attendance/100 + p*data.weights.activity/100 + bonus);
      const total=self===null||m===null||!isValidConfig()?null:(self*data.weights.self+m*data.weights.mid)/100;
      return {a,d,p,m,bonus,self,total};
    }
    function render() {
      document.querySelectorAll('.tab').forEach(btn=>btn.classList.toggle('active',btn.dataset.tab===currentTab));
      if(currentTab==='gradebook') renderGradebook();
      if(currentTab==='rubric') renderRubric();
      if(currentTab==='settings') renderSettings();
    }
    function renderGradebook() {
      const totals=data.students.map(s=>summarize(s).total).filter(v=>v!==null);
      const average=totals.length?totals.reduce((a,b)=>a+b,0)/totals.length:null;
      const groupCount=new Set(data.students.map(groupKey)).size;
      const configAlert=isValidConfig()?'':`<div class="hint error">Tỷ trọng chưa hợp lệ hoặc rubric có tiêu chí thiếu điểm tối đa. Hãy kiểm tra trong phần Thiết lập và Rubric.</div>`;
      $('#screen').innerHTML=`
        <div class="cards">
          <div class="stat"><span>Sinh viên</span><strong>${data.students.length}</strong></div>
          <div class="stat"><span>Nhóm / bài cá nhân</span><strong>${groupCount}</strong></div>
          <div class="stat"><span>Đã đủ dữ liệu tính điểm</span><strong>${totals.length}/${data.students.length}</strong></div>
          <div class="stat"><span>Trung bình điểm 50%</span><strong>${fmt(average)}/5</strong></div>
        </div>
        <section class="panel">
          <div class="section-head"><div><h2>${esc(data.course)}</h2><div class="muted">Bài tự học: ${fmt(data.weights.self,0)}% · Giữa kỳ: ${fmt(data.weights.mid,0)}% · Điểm danh: ${data.sessionsDone}/${SESSION_COUNT} buổi đã học</div></div>
          <div class="toolbar"><button class="btn secondary" data-action="exportCsv">Xuất CSV (mở bằng Excel)</button><button class="btn outline" data-action="exportJson">Sao lưu JSON</button><button class="btn outline" data-action="importJson">Khôi phục JSON</button></div></div>
          ${configAlert}
          <div class="hint">Nhập điểm bài theo nhóm ở nút <b>Chấm bài</b>. Điểm danh ghi từng buổi ở nút <b>Điểm danh</b>. Điểm chưa đủ dữ liệu hiển thị “—”, không tự động xem là 0.</div>
          <div class="table-wrap"><table>
            <thead><tr><th>Mã SV</th><th>Họ tên (demo)</th><th>Nhóm</th><th class="num">Bài tự học /10</th><th class="num">Điểm danh /10</th><th class="num">Tham gia /10</th><th class="num">Lượt cộng</th><th class="num">Giữa kỳ /10</th><th class="num">Điểm 30% /10</th><th class="num">Đóng góp 50% /5</th><th>Thao tác</th></tr></thead>
            <tbody>${data.students.length?data.students.map(s=>{
              const r=summarize(s);return `<tr>
                <td>${esc(s.id)}</td><td><b>${esc(s.name)}</b></td><td>${esc(s.group||'Cá nhân')}</td>
                <td class="num">${fmt(r.a)}</td><td class="num">${fmt(r.d)}</td>
                <td class="num"><input aria-label="Điểm tham gia của ${esc(s.name)}" type="number" min="0" max="10" step="0.1" value="${s.activity??''}" data-student="${esc(s.id)}" data-field="activity"></td>
                <td class="num"><input aria-label="Lượt cộng của ${esc(s.name)}" type="number" min="0" max="30" step="1" value="${s.bonuses??0}" data-student="${esc(s.id)}" data-field="bonuses"></td>
                <td class="num"><input aria-label="Điểm giữa kỳ của ${esc(s.name)}" type="number" min="0" max="10" step="0.1" value="${s.mid??''}" data-student="${esc(s.id)}" data-field="mid"></td>
                <td class="num"><b>${fmt(r.self)}</b></td><td class="num score">${fmt(r.total)}</td>
                <td><div class="actions"><button class="btn tiny" data-action="grade" data-id="${esc(s.id)}">Chấm bài</button><button class="btn tiny secondary" data-action="attendance" data-id="${esc(s.id)}">Điểm danh</button><button class="btn tiny danger" data-action="removeStudent" data-id="${esc(s.id)}">Xóa</button></div></td></tr>`;
            }).join(''):`<tr><td colspan="11" class="empty">Chưa có sinh viên. Hãy thêm ở biểu mẫu bên dưới.</td></tr>`}</tbody>
          </table></div>
          <form id="addStudentForm" class="form-row">
            <div><label for="sid">Mã sinh viên</label><input id="sid" required maxlength="30" placeholder="SV005"></div>
            <div><label for="sname">Họ và tên</label><input id="sname" required maxlength="100" placeholder="Sinh viên E" style="min-width:185px"></div>
            <div><label for="sgroup">Nhóm (có thể để trống)</label><input id="sgroup" maxlength="60" placeholder="Nhóm 3"></div>
            <button type="submit" class="btn">+ Thêm sinh viên</button>
          </form>
          <p class="footnote">Lưu ý: đây là dữ liệu minh họa. Bài trong cùng nhóm sử dụng chung điểm rubric, nhưng điểm danh, lượt cộng, tham gia và giữa kỳ là riêng từng sinh viên.</p>
        </section>`;
    }
    function renderRubric() {
      const maxSum=data.criteria.reduce((a,c)=>a+Number(c.max||0),0);
      $('#screen').innerHTML=`<section class="panel">
        <div class="section-head"><div><h2>Thiết kế rubric liên kết CLO</h2><div class="muted">Danh sách tiêu chí mẫu để giảng viên điều chỉnh. Đây chưa phải rubric chính thức của ĐCCT.</div></div><span class="badge ${Math.abs(maxSum-10)<.001?'ok':'wait'}">Tổng ${fmt(maxSum,1)} điểm</span></div>
        <div class="hint">Điểm bài được quy đổi về thang 10 dựa vào tổng điểm tối đa của rubric, sau đó áp dụng giới hạn điểm bài theo thiết lập.</div>
        <div class="table-wrap"><table style="min-width:740px"><thead><tr><th>Tiêu chí</th><th>Mã CLO liên kết</th><th class="num">Điểm tối đa</th><th></th></tr></thead><tbody>
        ${data.criteria.map(c=>`<tr><td><input class="wide" value="${esc(c.name)}" data-criterion="${esc(c.id)}" data-field="name" aria-label="Tên tiêu chí"></td><td><input style="width:195px" value="${esc(c.clo)}" data-criterion="${esc(c.id)}" data-field="clo" aria-label="CLO liên kết"></td><td class="num"><input type="number" step="0.1" min="0.1" max="10" value="${c.max}" data-criterion="${esc(c.id)}" data-field="max" aria-label="Điểm tối đa"></td><td><button class="btn danger tiny" data-action="removeCriterion" data-id="${esc(c.id)}">Xóa</button></td></tr>`).join('')}
        </tbody></table></div>
        <div class="toolbar" style="margin-top:15px"><button class="btn" data-action="addCriterion">+ Thêm tiêu chí</button></div>
        <div class="hint warning">Các CLO trong ví dụ chỉ minh họa. Cần nhập đúng mô tả, mã CLO từ ĐCCT trước khi chấm thật. Khi đổi rubric, điểm của nhóm phải được rà soát lại.</div>
      </section>`;
    }
    function inputField(label,name,value,opts={}) {return `<div><label for="${name}">${esc(label)}</label><input id="${name}" data-setting="${name}" type="${opts.type||'number'}" ${opts.type==='text'?'':`min="${opts.min??0}" max="${opts.max??100}" step="${opts.step??1}"`} value="${esc(value)}" ${opts.type==='text'?'style="width:100%"':''}></div>`;}
    function renderSettings() {
      const total=data.weights.self+data.weights.mid; const sub=data.weights.work+data.weights.attendance+data.weights.activity;
      $('#screen').innerHTML=`
        <div class="grid2"><section class="panel"><h2>1. Cơ cấu 50% điểm quá trình</h2><div class="grid2">
        ${inputField('Bài tự học / bài tập (%)','self',data.weights.self)}
        ${inputField('Giữa kỳ (%)','mid',data.weights.mid)}
        </div><div class="hint ${total!==50?'error':''}">Tổng: <b>${fmt(total,0)}%</b> — phải bằng 50%.</div></section>
        <section class="panel"><h2>2. Tỷ trọng bên trong điểm tự học</h2><div class="grid3">
        ${inputField('Bài theo rubric (%)','work',data.weights.work)}
        ${inputField('Điểm danh (%)','attendance',data.weights.attendance)}
        ${inputField('Tham gia (%)','activity',data.weights.activity)}
        </div><div class="hint ${sub!==100?'error':''}">Tổng: <b>${fmt(sub,0)}%</b> — phải bằng 100% (chưa gồm lượt cộng).</div></section></div>
        <div class="grid2" style="margin-top:16px"><section class="panel"><h2>3. Điểm danh và lượt cộng</h2><div class="grid2">
        ${inputField(`Số buổi đã học (0–${SESSION_COUNT})`,'sessionsDone',data.sessionsDone,{max:SESSION_COUNT})}
        ${inputField('Điểm mỗi lượt cộng','bonusUnit',data.bonusUnit,{max:10,step:.1})}
        ${inputField('Trần điểm cộng','bonusCap',data.bonusCap,{max:10,step:.1})}
        ${inputField('Giới hạn điểm bài theo rubric','cap',data.cap,{max:10,step:.1,min:.1})}
        </div></section>
        <section class="panel"><h2>4. Môn học và dữ liệu</h2><div>${inputField('Tên môn học','course',data.course,{type:'text'})}</div>
        <p class="muted">Dùng chức năng Sao lưu JSON trong tab Sổ điểm để tải về một bản dự phòng.</p>
        <button class="btn danger" data-action="reset">Khôi phục dữ liệu mẫu</button></section></div>
        <section class="panel" style="margin-top:16px"><h2>Công thức đang sử dụng</h2>
        <p>Điểm bài A = <b>min(trần điểm bài, điểm rubric quy đổi về 10)</b>.</p>
        <p>Điểm danh D = số buổi có mặt / số buổi đã học × 10. Chỉ tính khi mọi buổi đã học đã được ghi nhận.</p>
        <p>Điểm cộng C = min(số lượt cộng × điểm/lượt, trần điểm cộng).</p>
        <p><b>Tự học T = min(10, A × tỷ trọng bài + D × tỷ trọng điểm danh + điểm tham gia × tỷ trọng tham gia + C).</b></p>
        <p><b>Đóng góp 50% = T × trọng số tự học / 100 + điểm giữa kỳ × trọng số giữa kỳ / 100.</b></p>
        <div class="hint warning">Điểm chỉ tính nếu các tỷ trọng hợp lệ và đã nhập đủ dữ liệu. Nếu đổi quy định chấm điểm cần đối chiếu ĐCCT và quy chế chính thức.</div>
        </section>`;
    }
    function openGrade(studentId) {
      const student=data.students.find(s=>s.id===studentId); if(!student)return;
      const key=groupKey(student),scores=data.groupScores[key]||{};
      $('#modalBody').innerHTML=`<h2>Nhập điểm rubric — ${esc(groupLabel(student))}</h2>
        <p class="muted">Tất cả sinh viên thuộc cùng nhóm nhận chung điểm bài. Mức tối đa mỗi tiêu chí do rubric quy định.</p>
        <form id="gradeForm" data-key="${esc(key)}"><div class="criteria-list"><b>Tiêu chí</b><b>Mức tối đa</b><b>Điểm đạt</b>
        ${data.criteria.map(c=>`<div><b>${esc(c.name)}</b><div class="muted">${esc(c.clo)}</div></div><div>${fmt(Number(c.max),1)}</div><div><input aria-label="${esc(c.name)}" data-score="${esc(c.id)}" type="number" min="0" max="${c.max}" step="0.1" value="${scores[c.id]??''}" required></div>`).join('')}
        </div><div class="dialog-footer"><button type="button" class="btn secondary" data-action="closeModal">Hủy</button><button type="submit" class="btn">Lưu điểm</button></div></form>`;
      $('#modal').showModal();
    }
    function openAttendance(studentId) {
      const student=data.students.find(s=>s.id===studentId);if(!student)return;
      $('#modalBody').innerHTML=`<h2>Điểm danh — ${esc(student.name)}</h2>
      <p class="muted">Số buổi đã học: ${data.sessionsDone}/${SESSION_COUNT}. Các buổi chưa học sẽ không tính điểm.</p>
      <form id="attendanceForm" data-id="${esc(student.id)}"><div class="session-grid">
      ${Array.from({length:SESSION_COUNT},(_,i)=>`<div class="session-cell ${i>=data.sessionsDone?'future':''}"><label for="sess${i}">Buổi ${i+1}</label><select id="sess${i}" data-session="${i}" ${i>=data.sessionsDone?'disabled':''}>
      <option value="" ${student.attendance[i]===null||student.attendance[i]===undefined?'selected':''}>Chưa ghi</option>
      <option value="yes" ${student.attendance[i]===true?'selected':''}>Có mặt</option>
      <option value="no" ${student.attendance[i]===false?'selected':''}>Vắng</option></select></div>`).join('')}
      </div><div class="dialog-footer"><button type="button" class="btn secondary" data-action="closeModal">Hủy</button><button type="submit" class="btn">Lưu điểm danh</button></div></form>`;
      $('#modal').showModal();
    }
    function download(name, content, mime) {const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
    function csvCell(value) {
      let s=value===null||value===undefined?'':String(value);
      if (/^[\s]*[=+\-@]/.test(s))s="'"+s;
      return '"'+s.replace(/"/g,'""')+'"';
    }
    function exportCsv() {
      const headers=['Mã SV','Họ tên','Nhóm','Điểm bài /10','Điểm danh /10','Tham gia /10','Lượt cộng','Điểm cộng quy đổi','Giữa kỳ /10','Điểm thành phần tự học /10','Đóng góp điểm quá trình /5','Trạng thái'];
      const rows=data.students.map(s=>{const r=summarize(s);return [s.id,s.name,s.group,r.a===null?'':fmt(r.a),r.d===null?'':fmt(r.d),r.p===null?'':fmt(r.p),s.bonuses,fmt(r.bonus),r.m===null?'':fmt(r.m),r.self===null?'':fmt(r.self),r.total===null?'':fmt(r.total),r.total===null?'Chưa đủ dữ liệu':'Tạm tính / Demo'];});
      const content='\uFEFF'+[headers,...rows].map(row=>row.map(csvCell).join(';')).join('\r\n');
      download('bang_diem_qua_trinh_demo.csv',content,'text/csv;charset=utf-8');
    }
    function restoreFile(file) {
      if(!file)return;
      if(file.size>2000000){alert('Tệp quá lớn (tối đa 2 MB).');return;}
      const reader=new FileReader();reader.onload=()=>{try{
        const incoming=JSON.parse(reader.result);
        if(!incoming || !Array.isArray(incoming.students) || !Array.isArray(incoming.criteria) || !incoming.weights || !incoming.groupScores || !Number.isFinite(Number(incoming.sessionsDone)))throw Error('Không đúng định dạng');
        if(!confirm('Khôi phục sẽ thay thế toàn bộ dữ liệu hiện tại. Bạn có muốn tiếp tục?'))return;
        data=incoming;persist();render();alert('Đã nhập dữ liệu sao lưu.');
      }catch(err){alert('Không thể nhập file JSON: '+err.message)}};reader.readAsText(file);
    }
    document.addEventListener('click',(event)=>{
      const tab=event.target.closest('[data-tab]');if(tab){currentTab=tab.dataset.tab;render();return;}
      const btn=event.target.closest('[data-action]');if(!btn)return;
      const id=btn.dataset.id;const action=btn.dataset.action;
      if(action==='grade')openGrade(id);
      if(action==='attendance')openAttendance(id);
      if(action==='closeModal')$('#modal').close();
      if(action==='addCriterion'){data.criteria.push({id:'c'+Date.now(),name:'Tiêu chí mới',clo:'CLO chưa gán',max:1});persist();render();}
      if(action==='removeCriterion'&&data.criteria.length>1&&confirm('Xóa tiêu chí này? Điểm bài sẽ được tính lại.')){data.criteria=data.criteria.filter(c=>c.id!==id);persist();render();}
      if(action==='removeStudent'&&confirm('Xóa sinh viên '+id+' khỏi sổ điểm?')){data.students=data.students.filter(s=>s.id!==id);persist();render();}
      if(action==='exportCsv')exportCsv();
      if(action==='exportJson')download('sao_luu_clo_gradebook_demo.json',JSON.stringify(data,null,2),'application/json');
      if(action==='importJson')$('#importInput').click();
      if(action==='reset'&&confirm('Bạn chắc chắn muốn xóa các chỉnh sửa và khôi phục dữ liệu mẫu?')){data=defaultData();persist();render();}
    });
    document.addEventListener('change',(event)=>{
      const input=event.target;
      if(input.id==='importInput'){restoreFile(input.files[0]);input.value='';return;}
      if(input.dataset.student){const s=data.students.find(s=>s.id===input.dataset.student);if(!s)return;const field=input.dataset.field;const v=numeric(input.value);
        if(v!==null&&(!Number.isFinite(v)||v<0||v>(field==='bonuses'?30:10)||field==='bonuses'&&!Number.isInteger(v))){alert('Hãy nhập số hợp lệ trong khoảng cho phép.');render();return;}
        s[field]=field==='bonuses'?(v??0):v;persist();render();return;
      }
      if(input.dataset.criterion){const c=data.criteria.find(c=>c.id===input.dataset.criterion);if(!c)return;const field=input.dataset.field;
        if(field==='max'){const v=numeric(input.value);if(v===null||!Number.isFinite(v)||v<=0||v>10){alert('Điểm tối đa phải lớn hơn 0 và không quá 10.');render();return;}c.max=v;}
        else c[field]=input.value.trim();persist();render();return;
      }
      if(input.dataset.setting){const k=input.dataset.setting;
        if(k==='course'){data.course=input.value.trim()||'Môn học chưa đặt tên';}
        else{let v=numeric(input.value);const min=k==='cap'?.1:0;const max=k==='sessionsDone'?SESSION_COUNT:100;
          if(v===null||!Number.isFinite(v)||v<min||v>max||k==='sessionsDone'&&!Number.isInteger(v)){alert('Giá trị thiết lập không hợp lệ.');render();return;}
          if(k in data.weights)data.weights[k]=v;else data[k]=v;
        }persist();render();return;
      }
    });
    document.addEventListener('submit',(event)=>{
      if(!['addStudentForm','gradeForm','attendanceForm'].includes(event.target.id))return;
      event.preventDefault();const form=event.target;
      if(form.id==='addStudentForm'){
        const id=$('#sid').value.trim(),name=$('#sname').value.trim(),group=$('#sgroup').value.trim();
        if(!id||!name){alert('Cần nhập mã và họ tên.');return;}
        if(data.students.some(s=>s.id.toLocaleLowerCase()===id.toLocaleLowerCase())){alert('Mã sinh viên đã tồn tại.');return;}
        data.students.push({id,name,group,mid:null,activity:null,bonuses:0,attendance:Array(SESSION_COUNT).fill(null)});
      }
      if(form.id==='gradeForm'){
        const scores={};let ok=true;
        form.querySelectorAll('[data-score]').forEach(input=>{const v=numeric(input.value);if(v===null||!Number.isFinite(v)||v<0||v>Number(input.max))ok=false;else scores[input.dataset.score]=v;});
        if(!ok){alert('Điểm từng tiêu chí phải nằm trong khoảng 0 đến mức tối đa.');return;}
        data.groupScores[form.dataset.key]=scores;$('#modal').close();
      }
      if(form.id==='attendanceForm'){
        const s=data.students.find(s=>s.id===form.dataset.id);if(!s)return;
        form.querySelectorAll('[data-session]').forEach(sel=>{if(!sel.disabled)s.attendance[Number(sel.dataset.session)]=sel.value===''?null:sel.value==='yes';});
        $('#modal').close();
      }
      persist();render();
    });
    $('#modal').addEventListener('click',(event)=>{if(event.target===$('#modal'))$('#modal').close();});
    render();
  </script>
</body>
</html>
